<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Share Ideas — Muchina Family</title>
  <link rel="icon" type="image/svg+xml" href="assets/brain-logo.svg" />
  <link rel="stylesheet" href="css/style.css?v=5" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="site-brand"><a href="index.html"><img src="assets/brain-logo.svg" alt="" />Muchina Family<img class="family-logo" src="assets/happy-family.svg" alt="" /></a></h1>
      <button id="navToggle" class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <nav id="mainNav" class="main-nav">
        <a href="index.html">Home</a>
        <a href="announcements.html">Announcements</a>
        <a href="entertainment.html">Entertainment</a>
        <a href="ideas.html" aria-current="page">Share Ideas</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>Share Your Ideas</h2>
    <p>Have an idea for an event, recipe, or family project? Post it for everyone to see.</p>
    <section class="panel">
      <h3>Post an idea</h3>
      <form data-post-form data-kind="idea">
        <label for="idea-name">Your name (optional)</label>
        <input id="idea-name" name="author_name" type="text" maxlength="80" autocomplete="name" />
        <label for="idea-title">Idea title</label>
        <input id="idea-title" name="title" type="text" maxlength="120" required />
        <label for="idea-body">Tell us about your idea</label>
        <textarea id="idea-body" name="body" rows="5" maxlength="2000" required></textarea>
        <button class="btn" type="submit">Share idea</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
    <section class="panel" aria-labelledby="ideas-heading">
      <h3 id="ideas-heading">Ideas from the family</h3>
      <div data-post-list="idea" aria-live="polite"><p>Loading ideas…</p></div>
    </section>
  </main>

  <footer class="site-footer"><div class="container"><p>© Muchina Family</p></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
