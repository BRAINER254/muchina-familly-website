<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Entertainment — Muchina Family</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1><a href="index.html">Muchina Family</a></h1>
      <button id="navToggle" class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <nav id="mainNav" class="main-nav">
        <a href="index.html">Home</a>
        <a href="announcements.html">Announcements</a>
        <a href="entertainment.html" aria-current="page">Entertainment</a>
        <a href="ideas.html">Share Ideas</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>Entertainment</h2>
    <p>Share family videos. Videos publish immediately and are publicly viewable.</p>
    <section class="panel">
      <h3>Post a video</h3>
      <form data-video-form>
        <label for="video-name">Your name (optional)</label>
        <input id="video-name" name="author_name" type="text" maxlength="80" autocomplete="name" />
        <label for="video-title">Video title</label>
        <input id="video-title" name="title" type="text" maxlength="120" required />
        <label for="video-file">Video file (MP4, WebM, or MOV; up to 50 MB)</label>
        <input id="video-file" name="video" type="file" accept="video/mp4,video/webm,video/quicktime" required />
        <button class="btn" type="submit">Upload and publish video</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
    <section class="panel" aria-labelledby="videos-heading">
      <h3 id="videos-heading">Family videos</h3>
      <div data-video-list aria-live="polite"><p>Loading videos…</p></div>
    </section>
    <section class="panel">
      <h3>Family photos</h3>
      <div class="gallery">
        <img src="https://via.placeholder.com/600x400?text=Photo+1" alt="Family photo 1" data-full="https://via.placeholder.com/1200x800?text=Photo+1">
        <img src="https://via.placeholder.com/600x400?text=Photo+2" alt="Family photo 2" data-full="https://via.placeholder.com/1200x800?text=Photo+2">
        <img src="https://via.placeholder.com/600x400?text=Photo+3" alt="Family photo 3" data-full="https://via.placeholder.com/1200x800?text=Photo+3">
      </div>
    </section>
    <div id="lightbox" class="lightbox" hidden>
      <button id="closeLb" class="close" type="button" aria-label="Close photo">✕</button>
      <img id="lbImg" src="" alt="" />
    </div>
  </main>

  <footer class="site-footer"><div class="container"><p>© Muchina Family</p></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
