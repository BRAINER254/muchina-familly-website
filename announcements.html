<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Announcements — Muchina Family</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1><a href="index.html">Muchina Family</a></h1>
      <button id="navToggle" class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <nav id="mainNav" class="main-nav">
        <a href="index.html">Home</a>
        <a href="announcements.html" aria-current="page">Announcements</a>
        <a href="entertainment.html">Entertainment</a>
        <a href="ideas.html">Share Ideas</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>Announcements</h2>
    <p>Share family news with everyone. Announcements are published as soon as you submit them.</p>
    <section class="panel">
      <h3>Post an announcement</h3>
      <form data-post-form data-kind="announcement">
        <label for="announcement-name">Your name (optional)</label>
        <input id="announcement-name" name="author_name" type="text" maxlength="80" autocomplete="name" />
        <label for="announcement-title">Announcement title</label>
        <input id="announcement-title" name="title" type="text" maxlength="120" required />
        <label for="announcement-body">Details</label>
        <textarea id="announcement-body" name="body" rows="5" maxlength="2000" required></textarea>
        <button class="btn" type="submit">Publish announcement</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
    <section class="panel" aria-labelledby="announcements-heading">
      <h3 id="announcements-heading">Recent announcements</h3>
      <div data-post-list="announcement" aria-live="polite"><p>Loading announcements…</p></div>
    </section>
  </main>

  <footer class="site-footer"><div class="container"><p>© Muchina Family</p></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
